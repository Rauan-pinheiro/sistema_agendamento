<!doctype html>
<html lang="pt-BR" data-empresa="barbearia">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hoje · Direção C</title>
<link rel="preload" href="../comum/fontes/bricolage.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="estilo.css">
</head>
<body data-painel="hoje">
<div class="app">
  <aside class="lateral">
    <div class="empresa"><span class="logo-p" aria-hidden="true">CC</span>Canto do Corte</div>
    <nav data-lateral aria-label="Painel"></nav>
    <div class="rodape"><img src="../comum/fotos/ze.webp" alt="">Zé Ricardo</div>
  </aside>
  <div>
    <header class="topo">
      <div class="empresa"><span class="logo-p" aria-hidden="true">CC</span>Canto do Corte</div>
      <div class="acoes"><button type="button" class="btn btn--icone" data-tema></button></div>
    </header>
    <main class="painel">
      <div class="cab">
        <h1>Quinta, 29 de outubro</h1>
        <div class="direita"><button type="button" class="btn btn--pinho" data-novo></button></div>
      </div>
      <div class="resumo-dia" data-resumo></div>
      <div class="hoje-grade">
        <section class="folha-p" aria-labelledby="t-dia">
          <h2 id="t-dia">Folha do dia</h2>
          <div class="dia-lista" data-lista></div>
        </section>
        <div style="display:grid;gap:20px">
          <section class="folha-p" aria-labelledby="t-pend">
            <h2 id="t-pend">Falta confirmar</h2>
            <ul class="pend" data-pend></ul>
          </section>
          <section class="folha-p" aria-labelledby="t-sem">
            <h2 id="t-sem">Esta semana</h2>
            <div class="semana-p">
              <dl data-semana></dl>
              <div class="ocupacao" data-ocupacao></div>
            </div>
          </section>
        </div>
      </div>
    </main>
  </div>
  <nav class="abas" data-abas aria-label="Painel"></nav>
</div>
<script src="../comum/dados.js"></script>
<script src="../comum/proto.js"></script>
<script>
const { E, brl, icone, minutos } = P;
const $ = (s) => document.querySelector(s);
const preco = (n) => (E.servicos.find((s) => s.nome === n) || { preco: 0 }).preco;
const todos = E.agenda.flatMap((l, pi) => l.map(([ini, d, cliente, servico, status]) => ({ ini, d, cliente, servico, status, pro: E.profissionais[pi].nome.split(' ')[0] })))
  .filter((e) => e.status !== 'cancelado').sort((a, b) => minutos(a.ini) - minutos(b.ini));
const AGORA = minutos('13:40');

$('[data-novo]').innerHTML = `${icone('mais1')} Novo agendamento`;
const feitos = todos.filter((e) => e.status === 'concluido');
$('[data-resumo]').innerHTML = [
  ['clientes hoje', todos.length], ['já atendidos', feitos.length],
  ['previsto no dia', `<span class="realce">${brl(todos.reduce((a, e) => a + preco(e.servico), 0))}</span>`]
].map(([t, v]) => `<span><b>${v}</b>${t}</span>`).join('');

const grupos = [['Manhã', 0, 12 * 60], ['Tarde', 12 * 60, 18 * 60], ['Noite', 18 * 60, 24 * 60]];
$('[data-lista]').innerHTML = grupos.map(([g, a, b]) => {
  const itens = todos.filter((e) => minutos(e.ini) >= a && minutos(e.ini) < b);
  return `<h3 class="turno-p">${g}</h3>` + itens.map((e) => {
    const agora = minutos(e.ini) <= AGORA && minutos(e.ini) + e.d > AGORA;
    const feito = e.status === 'concluido';
    const lado = agora ? '<span class="selo selo--marca">Agora</span>' : feito ? '<span class="muted" style="font-size:14px">Atendido</span>'
      : e.status === 'pendente' ? '<span class="selo selo--aviso">Aguardando</span>' : '<span class="selo selo--ok">Confirmado</span>';
    const zap = feito ? '' : `<a class="btn btn--icone btn--pequeno" href="#" aria-label="WhatsApp de ${e.cliente}">${icone('mensagem')}</a>`;
    return `<div class="item-dia${agora ? ' agora' : ''}${feito ? ' feito' : ''}"><span class="h">${e.ini}</span><span class="quem"><b>${e.cliente}</b><span>${e.servico} · ${e.pro}</span></span><span class="lado">${lado}${zap}</span></div>`;
  }).join('');
}).join('');

$('[data-pend]').innerHTML = todos.filter((e) => e.status === 'pendente').map((e) =>
  `<li><span><b>${e.cliente}</b><small>${e.ini} · ${e.servico}</small></span><button type="button" class="btn btn--pequeno">Confirmar</button></li>`).join('');
const S = E.semana;
$('[data-semana]').innerHTML = [['Agendamentos', S.agendamentos], ['Receita prevista', brl(S.receita)], ['Clientes novos', S.novos], ['Média por dia', Math.round(S.agendamentos / 6)]]
  .map(([t, v]) => `<div><dt>${t}</dt><dd>${v}</dd></div>`).join('');
$('[data-ocupacao]').innerHTML = `<p><span>Agenda ocupada</span><b>${S.ocupacao}%</b></p><div class="trilho" role="img" aria-label="${S.ocupacao}% da agenda ocupada"><i style="width:${S.ocupacao}%"></i></div>`;
</script>
</body>
</html>
