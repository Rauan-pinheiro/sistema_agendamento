<!doctype html>
<html lang="pt-BR" data-empresa="barbearia">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda · Direção A</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body data-painel="agenda">
<div class="app">
  <aside class="lateral">
    <div class="empresa"><span class="logo" aria-hidden="true">CC</span>Canto do Corte</div>
    <nav data-lateral aria-label="Painel"></nav>
    <div class="rodape"><img src="../comum/fotos/ze.webp" alt="">Zé Ricardo</div>
  </aside>
  <div>
    <header class="topo">
      <div class="empresa"><span class="logo" aria-hidden="true">CC</span>Canto do Corte</div>
      <div class="acoes"><button type="button" class="btn btn--icone" data-tema></button></div>
    </header>
    <main class="painel">
      <div class="agenda-barra">
        <h1>Quinta, 29 de outubro</h1>
        <button type="button" class="btn btn--icone" aria-label="Dia anterior" data-ic="esq"></button>
        <button type="button" class="btn">Hoje</button>
        <button type="button" class="btn btn--icone" aria-label="Próximo dia" data-ic="dir"></button>
        <div class="direita">
          <div class="segmento" role="group" aria-label="Visualização">
            <button type="button" data-visao="dia" aria-pressed="true">Dia</button>
            <button type="button" data-visao="semana" aria-pressed="false">Semana</button>
          </div>
          <button type="button" class="btn btn--acao" data-ic="mais1" aria-label="Novo agendamento"></button>
        </div>
      </div>
      <div class="cal-bloco"><div class="cal-rolagem" data-agenda='{"ini":8,"fim":20,"px":64}'></div></div>
      <div class="legenda" aria-hidden="true">
        <span><i style="background:var(--destaque-suave);box-shadow:inset 3px 0 var(--destaque)"></i>Confirmado</span>
        <span><i style="border:1px dashed var(--aviso)"></i>Aguardando confirmação</span>
        <span><i style="background:var(--surface-2);box-shadow:inset 3px 0 var(--line-forte)"></i>Concluído</span>
        <span><i style="background:repeating-linear-gradient(135deg,var(--surface-2) 0 3px,var(--surface) 3px 6px)"></i>Cancelado</span>
      </div>
    </main>
  </div>
  <nav class="abas" data-abas aria-label="Painel"></nav>
</div>
<script src="../comum/dados.js"></script>
<script src="../comum/proto.js"></script>
<script>
document.querySelectorAll('[data-ic]').forEach((b) => (b.innerHTML = P.icone(b.dataset.ic)));
const alvo = document.querySelector('[data-agenda]');
P.agenda(alvo, JSON.parse(alvo.dataset.agenda));
</script>
</body>
</html>
