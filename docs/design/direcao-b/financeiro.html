<!doctype html>
<html lang="pt-BR" data-empresa="salao">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Financeiro · Direção B</title>
<link rel="preload" href="../comum/fontes/figtree.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="estilo.css">
</head>
<body data-painel="financeiro">
<div class="app">
  <aside class="lateral">
    <div class="empresa"><span class="logo-p" aria-hidden="true">SL</span>Studio Lume</div>
    <nav data-lateral aria-label="Painel"></nav>
    <div class="convite"><b>Sua página está no ar</b>studio-lume na AgendaFácil. Compartilhe no Instagram.</div>
  </aside>
  <div>
    <header class="topo">
      <div class="empresa"><span class="logo-p" aria-hidden="true">SL</span>Studio Lume</div>
      <div class="acoes"><button type="button" class="btn btn--icone" data-tema></button><img class="eu" src="../comum/fotos/carla.webp" alt="Carla Menezes"></div>
    </header>
    <main class="painel">
      <div class="cab">
        <h1>Financeiro</h1>
        <div class="direita">
          <div class="segmento" role="group" aria-label="Período">
            <button type="button" aria-pressed="true">Outubro</button>
            <button type="button" aria-pressed="false">Setembro</button>
            <button type="button" aria-pressed="false">Ano</button>
          </div>
        </div>
      </div>

      <section class="painel-cartao fin-hero" aria-labelledby="t-rec">
        <h2 id="t-rec" class="rotulo">Você recebeu em outubro</h2>
        <span class="valor" data-receita></span>
        <span class="variacao" data-variacao></span>
        <div class="grafico" data-grafico></div>
        <div class="eixo" aria-hidden="true"><span>1 out</span><span>15 out</span><span>Hoje</span></div>
      </section>
      <dl class="blocos" data-blocos></dl>

      <div class="fin-grade">
        <section class="painel-cartao" aria-labelledby="t-serv">
          <h2 id="t-serv">O que mais vendeu</h2>
          <ol class="ranking" data-servicos></ol>
        </section>
        <section class="painel-cartao" aria-labelledby="t-pro">
          <h2 id="t-pro">Por profissional</h2>
          <ol class="ranking" data-pros></ol>
        </section>
      </div>

      <section class="painel-cartao" style="margin-top:16px;overflow:hidden" aria-labelledby="t-con">
        <h2 id="t-con">Atendimentos concluídos</h2>
        <table class="tabela tabela--cartoes"><thead><tr><th>Quando</th><th>Cliente</th><th>Serviço</th><th>Profissional</th><th class="dir">Valor</th></tr></thead><tbody data-recentes></tbody></table>
      </section>
    </main>
  </div>
  <nav class="abas" data-abas aria-label="Painel"></nav>
</div>
<script src="../comum/dados.js"></script>
<script src="../comum/proto.js"></script>
<script>
const { E, foto, brl, icone } = P;
const F = E.financeiro;
const $ = (s) => document.querySelector(s);
$('[data-receita]').textContent = brl(F.receita);
$('[data-variacao]').innerHTML = `${icone('sobe')} ${Math.round(((F.receita - F.anterior) / F.anterior) * 100)}% a mais que em setembro`;
P.grafico($('[data-grafico]'), P.serieMes(F.receita), 'Receita por dia em outubro; sextas e sábados são os dias mais fortes');
$('[data-blocos]').innerHTML = [
  ['Atendimentos', F.atendimentos, ''], ['Ticket médio', brl(Math.round(F.receita / F.atendimentos)), ''],
  ['A receber até 31/10', brl(F.aReceber), 'já agendado'], ['Cancelamentos', F.cancelamentos, brl(F.perdido) + ' a menos']
].map(([t, v, s]) => `<div><dt>${t}</dt><dd>${v}${s ? `<small>${s}</small>` : ''}</dd></div>`).join('');
const fotoDe = (n) => (E.servicos.find((s) => s.nome === n) || {}).foto;
const max = F.porServico[0][1];
$('[data-servicos]').innerHTML = F.porServico.map(([n, v, q]) =>
  `<li><img src="${foto(fotoDe(n))}" alt=""><span><b>${n}</b><small>${q} atendimentos</small><span class="prop"><i style="width:${(v / max) * 100}%"></i></span></span><span class="v">${brl(v)}</span></li>`).join('');
$('[data-pros]').innerHTML = F.porProfissional.map(([n, v]) => {
  const p = E.profissionais.find((x) => x.nome === n);
  return `<li><img class="redondo" src="${foto(p.foto)}" alt=""><span><b>${n}</b><small>${p.papel}</small><span class="prop"><i style="width:${(v / F.porProfissional[0][1]) * 100}%"></i></span></span><span class="v">${brl(v)}</span></li>`;
}).join('');
$('[data-recentes]').innerHTML = F.recentes.map(([q, c, s, p, v]) => `<tr><td>${q}</td><td>${c}</td><td>${s}</td><td>${p}</td><td class="dir">${brl(v)}</td></tr>`).join('');
</script>
</body>
</html>
